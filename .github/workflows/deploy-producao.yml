name: deploy-neon-prod

on:
    push:
        branches:
            - 'main'
        paths:
            - 'sql/**'

permissions:
    contents: read

jobs:    
    deploy-producao:
        name: Deploy no banco em produção
        runs-on: ubuntu-latest

        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Instala postgres
            run: |
                sudo apt-get update -y
                sudo apt-get install -y postgresql-client

          - name: Exclui banco atual
            env:
                DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
            run: |
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
                    DROP SCHEMA IF EXISTS public CASCADE;
                    DROP SCHEMA IF EXISTS pdca CASCADE;
                    DROP SCHEMA IF EXISTS auditoria CASCADE;
                SQL


          - name: Aplica todos os scripts no banco em produção
            env:
                DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
            run: |
                for arquivo in sql/*.sql; do
                    echo "Aplicando $arquivo"

                    if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$arquivo"; then
                        echo "::error file=$arquivo::Falha ao aplicar $arquivo"
                        exit 1
                    fi
                done