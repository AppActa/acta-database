name: deploy-neon-prod

on:
    push:
        branches: [main]
        paths:
            - 'sql/**'
            - 'python/**'

permissions:
    contents: read

jobs:    
    deploy-producao:
        name: Deploy no banco em produção
        runs-on: ubuntu-latest

        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Instala postgres
            run: |
                sudo apt-get update -y
                sudo apt-get install -y postgresql-client

          - name: Aplica todos os scripts no banco em produção
            env:
                DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
            run: |
                for arquivo in sql/*.sql; do
                    echo "Aplicando $arquivo"

                    if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$arquivo"; then
                        echo "::error file=$arquivo::Falha ao aplicar $arquivo"
                        exit 1
                    fi
                done

          - name: Configura Python
            uses: actions/setup-python@v5
            with:
                python-version: '3.12'

          - name: Instala dependências do dataload
            run: python -m pip install --disable-pip-version-check -r python/requirements.txt

          - name: Executa dataload Python em produção
            env:
                FULL_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
            run: papermill python/dataload.ipynb /tmp/dataload-output.ipynb
        
          - name: Executa RPA em produção
            env:
                FULL_URL: ${{ secrets.URL_SEGUNDO_BANCO }}
                URL_PRIMEIRO_BANCO: ${{ secrets.PRIMEIRO_DATABASE_URL }}
            run: papermill python/rpa.py /tmp/rpa-output.py