name: valida-postgres-local-dev

on:
    pull_request:
        branches: [main]
        paths:
            - 'sql/**'

permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    deploy-teste:
        name: Valida scripts no PostgreSQL local
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: acta_test
                    POSTGRES_USER: acta_test
                    POSTGRES_PASSWORD: acta_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U acta_test -d acta_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql://acta_test:acta_test@localhost:5432/acta_test

        steps:
          - name: Instala cliente PostgreSQL (para o act)
            run: sudo apt-get update && sudo apt-get install postgresql-client

          - name: Checkout
            uses: actions/checkout@v4

          - name: Aplica todos os scripts no banco local
            run: |
                for arquivo in sql/*.sql; do
                    echo "Aplicando $arquivo"

                    if ! psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$arquivo"; then
                        echo "::error file=$arquivo::Falha ao aplicar $arquivo"
                        exit 1
                    fi
                done


          - name: Comenta resultado na Pull Request
            if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
            uses: actions/github-script@v7
            with:
                script: |
                    const status = '${{ job.status }}'
                    const mensagem = status === 'success' ? '✅ **Script aplicado com sucesso no PostgreSQL local!** Os arquivos .sql alterados desta Pull Request foram validados em um banco descartável.' : '❌ **Falha ao aplicar o script no PostgreSQL local.** Verifique os logs do workflow para ter detalhes.'

                    await github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: mensagem
                    })
